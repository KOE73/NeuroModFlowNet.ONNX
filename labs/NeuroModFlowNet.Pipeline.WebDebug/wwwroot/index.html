<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NeuroModFlowNet · VM Debug</title>
  <link rel="stylesheet" href="shell/icons/tabler-icons.css"><link rel="stylesheet" href="shell/themes.css">
  <link rel="stylesheet" href="shell/shell.css"><link rel="stylesheet" href="debug.css">
  <link rel="stylesheet" href="vendor/dockview/dockview.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="theme-debug-extensions.css"><link rel="stylesheet" href="panel-schemes.css"><link rel="stylesheet" href="batches.css">
  <script type="module" src="debug.js"></script>
</head>
<body>
<div class="lu-shell" data-theme="cream" data-density="nano" data-page="overview" data-tooltips="true" id="shell">
  <header class="shell-topbar">
    <button id="menu" data-label="menu" data-tip="menu"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
    <strong class="shell-brand"><i class="ti ti-bolt" aria-hidden="true"></i>VM Debug</strong>
    <span class="shell-version">NeuroModFlowNet</span><select id="viewer-camera" hidden></select><div class="shell-stats" id="connection" role="status"></div>
    <details id="panels-menu"><summary data-i18n="panels"></summary><div class="appearance-menu"><button data-panel="instructions" data-i18n="instructions"></button><button data-panel="registers" data-i18n="registers"></button><button data-panel="preview" data-i18n="image"></button><button id="reset-layout" data-i18n="resetlayout"></button><button id="new-viewer" data-i18n="newviewer"></button></div></details>
    <button id="diagnostics" data-label="diagnostics" data-tip="nodiagnostics"><i class="ti ti-list-details" aria-hidden="true"></i></button>
    <span id="message-announcement" class="sr-only" role="status" aria-live="polite"></span>
    <details class="appearance" id="appearance"><summary><i class="ti ti-palette" aria-hidden="true"></i> <span id="appearance-label"></span></summary><div class="appearance-menu" id="appearance-menu"></div></details>
    <button id="language" aria-label="Language / Язык">RU</button>
  </header>
  <div class="shell-body">
    <aside class="shell-sidebar"><nav aria-label="Разделы" data-label="sections">
      <span class="nav-caption" data-i18n="sections"></span>
      <a href="#overview" class="active" id="overview-nav"><i class="ti ti-chart-bar" aria-hidden="true"></i><span data-i18n="overview"></span></a>
      <div class="nav-children" id="camera-nav"></div>
      <a href="#batches" id="batches-nav"><i class="ti ti-apps" aria-hidden="true"></i><span data-i18n="batches"></span></a>
      <div class="settings-menu"><a href="#settings" id="settings-nav"><i class="ti ti-settings" aria-hidden="true"></i><span data-i18n="settings"></span></a></div>
    </nav></aside>
    <main class="shell-content workspace-page">
      <div class="page-header">
        <h1 data-i18n="heading"></h1>
        <div class="toolbar"><button id="start" data-i18n="start"></button><button id="stop" disabled data-i18n="stop"></button><button id="help" data-label="help" data-tip="help">ⓘ</button></div>
      </div>
      <section class="panel cameras-panel" aria-label="Камеры" data-label="cameras">
        <div class="table-scroll" tabindex="0" data-label="cameras">
          <table class="camera-table"><colgroup><col><col><col><col><col><col><col><col><col><col><col></colgroup>
            <thead><tr><th data-i18n="camera"></th><th data-i18n="state"></th><th data-i18n="decoder"></th><th class="number">W</th><th class="number">H</th><th class="number" data-i18n="frames"></th><th class="number">FPS</th><th class="number" data-i18n="runms"></th><th class="number" data-i18n="tracks"></th><th class="number" data-i18n="failures"></th><th data-i18n="text"></th></tr></thead>
            <tbody id="cameras"></tbody>
          </table>
        </div>
      </section>
      <section id="batches-page" data-label="batches">
        <div class="page-header"><h1 data-i18n="batches"></h1><div class="toolbar"><label><input id="batch-collect" type="checkbox" checked><span data-i18n="batchCollect"></span></label><span id="batch-state" class="muted"></span><button class="row-action" id="batch-help" data-label="batchHelp" data-tip="batchHelp">ⓘ</button></div></div>
        <section class="panel batch-summary"><div class="pane-scroll" tabindex="0" data-label="batchServices"><table class="batch-services"><colgroup><col><col><col><col><col><col><col><col><col><col></colgroup><thead><tr><th data-i18n="batchModel"></th><th data-i18n="batchBackend"></th><th class="number" data-i18n="batchLimit" data-tip="batchLimitTip"></th><th class="number" data-i18n="batchWait"></th><th class="number" data-i18n="batchQueue" data-tip="batchQueueTip"></th><th class="number" data-i18n="batchPrepared" data-tip="batchPreparedTip"></th><th class="number" data-i18n="batchCompleted"></th><th class="number" data-i18n="batchRequests"></th><th class="number" data-i18n="batchInput" data-tip="batchRowsTip"></th><th class="number" data-i18n="batchDuration" data-tip="batchDurationTip"></th></tr></thead><tbody id="batch-services"></tbody></table></div></section>
        <div class="batch-detail-heading"><strong id="batch-selected">—</strong><span class="muted" data-i18n="batchRecent"></span><select id="batch-window" data-label="batchWindow"><option>64</option><option>128</option><option>256</option></select></div>
        <div class="batch-charts"><figure><figcaption data-i18n="batchRequestChart"></figcaption><div id="batch-request-chart"></div></figure><figure><figcaption data-i18n="batchRowChart"></figcaption><div id="batch-row-chart"></div></figure></div>
        <section class="panel batch-history"><div class="panel-header"><h2 data-i18n="batchHistory"></h2><span id="batch-history-count" class="muted"></span></div><div class="pane-scroll" tabindex="0" data-label="batchHistory"><table><thead><tr><th class="number">#</th><th data-i18n="batchTime"></th><th data-i18n="state"></th><th class="number" data-i18n="batchRequests"></th><th class="number" data-i18n="batchRows"></th><th data-i18n="batchSplit"></th><th class="number" data-i18n="batchAssembly"></th><th class="number" data-i18n="batchDuration" data-tip="batchDurationTip"></th></tr></thead><tbody id="batch-history"></tbody></table></div></section>
      </section>
      <div class="debug-toolbar toolbar">
        <div class="debug-actions" role="group" data-label="debugcontrols">
          <button class="debug-command" data-command="pause" data-label="pause" data-tip="pausetip"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
          <button class="debug-command" data-command="continue" data-label="continue" data-tip="continuetip"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 4v16l14-8z"/></svg></button>
          <button class="debug-command" data-command="step" data-label="step" data-tip="steptip"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h8a4 4 0 0 1 4 4v5m-4-4 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="20" r="1.5" fill="currentColor"/></svg></button>
          <button class="debug-command" data-command="next-frame" data-label="nextframe" data-tip="nextframetip"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="m7 8 7 4-7 4zM16 8h2v8h-2z"/></svg></button>
          <button class="debug-command" data-command="detach" data-label="detach" data-tip="detachtip"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3v5m6-5v5M4 8h10v3a5 5 0 0 1-10 0zM9 16v5m8-13 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <strong id="selected-camera">—</strong><span id="stop-location" class="mono location">—</span>
      </div>
      <div class="debug-columns">
        <section class="panel debug-pane instruction-pane">
          <div class="panel-header"><h2 data-i18n="instructions"></h2><span id="instruction-count" class="muted"></span></div>
          <div class="pane-scroll" tabindex="0" data-label="instructions"><table class="instruction-table"><colgroup><col class="breakpoint-column"><col class="action-column"><col class="pointer-column"><col class="index-column"><col><col class="timing-column"></colgroup><thead><tr><th data-i18n="breakpoint"></th><th data-i18n="runtoshort" data-tip="runtotip"></th><th data-label="currentinstruction"></th><th class="number">#</th><th data-i18n="instruction"></th><th class="number" data-i18n="ms"></th></tr></thead><tbody id="instructions"></tbody></table></div>
          <div id="instruction-io" class="pane-footer mono">—</div>
        </section>
        <div class="pane-divider" role="separator" aria-orientation="vertical" tabindex="0" data-divider="0" data-label="resizeinstructions" data-tip="resizetip"></div>
        <section class="panel debug-pane register-pane">
          <div class="panel-header"><h2 data-i18n="registers"></h2><span id="register-count" class="muted"></span></div><div class="register-point-toolbar"><i class="ti ti-clock" aria-hidden="true" data-tip="watchpointtip"></i><div id="register-point-control"></div><button id="register-help" class="row-action" data-label="registercataloghelp" data-tip="registermetadatatip">ⓘ</button></div>
          <div class="pane-scroll" tabindex="0" data-label="registers"><table class="register-table"><colgroup><col class="action-column"><col class="action-column"><col class="action-column"><col><col class="memory-column"><col class="shape-column"></colgroup><thead><tr><th data-label="watch" data-tip="watchtip" class="register-watch-cell"><i class="ti ti-refresh" aria-hidden="true"></i></th><th data-label="inspect" class="register-action-cell"></th><th data-label="preview" class="register-action-cell second-action"></th><th data-sort="key" aria-sort="ascending"><button class="sort-header" data-sort="key"><span data-i18n="register"></span><span class="sort-indicator" aria-hidden="true"></span></button></th><th data-sort="memory" aria-sort="none"><button class="sort-header" data-sort="memory"><span data-i18n="memory"></span><span class="sort-indicator" aria-hidden="true"></span></button></th><th data-sort="shape" aria-sort="none"><button class="sort-header" data-sort="shape"><span data-i18n="shape"></span><span class="sort-indicator" aria-hidden="true"></span></button></th></tr></thead><tbody id="registers"></tbody></table></div>
        </section>
        <div class="pane-divider" role="separator" aria-orientation="vertical" tabindex="0" data-divider="1" data-label="resizeregisters" data-tip="resizetip"></div>
        <section class="panel debug-pane preview-pane">
          <div class="panel-header"><h2 data-i18n="image"></h2><button id="pin" data-i18n="pin" disabled></button><button id="live" data-i18n="resultframe"></button></div>
          <div class="watch-toolbar">
            <label><input type="checkbox" id="watch-enabled"><span data-i18n="watch"></span></label>
            <label data-tip="watchfpstip">FPS <input id="watch-fps" type="number" min="0.2" max="15" step="0.2" value="3" data-label="watchfps"></label>
            <label data-tip="watchsizetip">px <select id="watch-size" data-label="watchsize"><option>320</option><option>640</option><option>1000</option><option>1600</option><option>2000</option></select></label>
          </div>
          <div class="pane-scroll image-scroll" tabindex="0" data-label="image">
            <div id="watch-gallery" hidden></div>
            <figure id="pinned-figure" hidden><figcaption id="pinned-caption"></figcaption><img id="pinned-image" alt=""></figure>
            <figure id="preview-figure" hidden><figcaption id="preview-caption"></figcaption><a id="image-link" target="_blank" rel="noopener"><img id="preview-image" alt=""></a></figure>
            <p class="empty muted" id="image-empty" data-i18n="imageempty"></p>
            <pre id="value-output" hidden></pre>
          </div>
        </section>
      </div>
    </main>
  </div>
  <dialog id="dialog"><form method="dialog" class="dialog-header"><h2 id="dialog-title"></h2><button class="row-action" data-label="close">×</button></form><div id="dialog-body"></div></dialog>
</div>
</body></html>
